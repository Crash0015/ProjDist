name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run architecture rules
        run: npx dependency-cruiser --config .dependency-cruiser.js apps

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ticketing-api apps/api
      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ticketing-api
          format: table
          exit-code: 0

  dockle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ticketing-api apps/api
      - name: Run Dockle
        uses: erzz/dockle-action@v1
        with:
          image: ticketing-api

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ticketing-api apps/api
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.16.0
        with:
          image: ticketing-api

  grype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ticketing-api apps/api
      - name: Scan with Grype
        uses: anchore/scan-action@v3
        with:
          image: ticketing-api
