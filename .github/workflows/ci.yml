name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticket_user
          POSTGRES_PASSWORD: ticket_pass
          POSTGRES_DB: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_user" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install API deps
        run: npm install
        working-directory: apps/api
      - name: Migrate db
        run: psql postgres://ticket_user:ticket_pass@localhost:5432/ticketing -f apps/api/src/db/schema.sql
      - name: Run API tests
        run: npm test
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://ticket_user:ticket_pass@localhost:5432/ticketing
          JWT_SECRET: test-secret
          WEB_URL: http://localhost:5173

  e2e:
    runs-on: ubuntu-latest
    needs: api-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticket_user
          POSTGRES_PASSWORD: ticket_pass
          POSTGRES_DB: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_user" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install API deps
        run: npm install
        working-directory: apps/api
      - name: Install web deps
        run: npm install
        working-directory: apps/web
      - name: Install Playwright
        run: npm install
        working-directory: tests/e2e
      - name: Install browsers
        run: npx playwright install --with-deps
        working-directory: tests/e2e
      - name: Migrate db
        run: psql postgres://ticket_user:ticket_pass@localhost:5432/ticketing -f apps/api/src/db/schema.sql && psql postgres://ticket_user:ticket_pass@localhost:5432/ticketing -f apps/api/src/db/seed.sql
      - name: Start API
        run: node src/index.js &
        working-directory: apps/api
        env:
          PORT: 4000
          DATABASE_URL: postgres://ticket_user:ticket_pass@localhost:5432/ticketing
          JWT_SECRET: test-secret
          WEB_URL: http://localhost:5173
      - name: Build web
        run: npm run build
        working-directory: apps/web
      - name: Install serve
        run: npm install --global serve
      - name: Serve web
        run: npx serve dist -l 5173 &
        working-directory: apps/web
      - name: Run Playwright
        run: npx playwright test
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:5173
