services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_pass
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://ticket_user:ticket_pass@db:5432/ticketing
      JWT_SECRET: dev-secret
      WEB_URL: http://localhost:5173
      AUTO_SEED: "true"
    ports:
      - "4000:4000"
    depends_on:
      - db

  web:
    build:
      context: ../apps/web
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
